server {
    listen 80;
    root /usr/share/nginx/html;

    # UI and API on one origin, as CloudFront does in production: the session
    # cookie stays SameSite=Strict and there is no CORS to set up
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
